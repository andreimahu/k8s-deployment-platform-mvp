components:
  web:
    image: sample-app-web:local
    command: ["npx", "vite", "preview"]
    args: ["--host", "0.0.0.0", "--port", "4173", "--strictPort"]
    http:
      port: 4173
      healthPath: /
  api:
    image: sample-app-api:local
    database: true
    http:
      port: 8080
      healthPath: /hello

database:
  image: postgres:17-alpine
  name: api-db
  user: api-user
  password: api-password
